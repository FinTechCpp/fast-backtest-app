        # Create Discord embed message for release
        cat <<EOF > discord_payload.json
        {
          "embeds": [
            {
              "title": "🚀 Nouvelle Release - fast-backtest-app v${{ env.VERSION }}",
              "description": "Une nouvelle version de l'application est disponible pour toutes les plateformes !",
              "color": 65280,
              "fields": [
                {
                  "name": "📦 Version",
