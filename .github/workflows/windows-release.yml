# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json

name: Windows Release Build

on:
  push:
    branches: [ main, releases ]
  pull_request:
    branches: [ main, releases ]

env:
  BUILD_TYPE: Release
  QT_VERSION: 6.8.3

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      actions: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0  # Necessary to get all tags
        token: ${{ secrets.SUBMODULE_PAT }}

    - name: Calculate version
      id: version
      run: |
        # Get the latest existing tag
        $lastTag = git describe --tags --abbrev=0 2>$null
        
        if (-not $lastTag) {
          # If no tag exists, use the base version from the VERSION file
          $baseVersion = Get-Content "VERSION" -Raw
          $baseVersion = $baseVersion.Trim()
          $version = "$baseVersion.1"  # Start with .1
        } else {
          # Extract the version from the last tag (without the 'v' prefix)
          $lastVersion = $lastTag -replace '^v', ''
          
          # Split the version into parts
          $versionParts = $lastVersion.Split('.')
          
          # Increment the last number
          $lastPart = [int]$versionParts[-1] + 1
          $versionParts[-1] = $lastPart
          
          # Rebuild the full version
          $version = $versionParts -join '.'
        }
        
        echo "VERSION=$version" >> $env:GITHUB_ENV
        echo "version=$version" >> $env:GITHUB_OUTPUT

        echo "Last tag: $lastTag"
        echo "New version: $version"

    - name: Set up MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        modules: qtcharts 
        cache: true

    - name: Verify Qt installation
      run: |
        echo "Qt version: ${{ env.QT_VERSION }}"
        echo "Qt6_DIR: $env:Qt6_DIR"
        echo "QT_ROOT_DIR: $env:QT_ROOT_DIR"
        qmake --version
        where qmake

    - name: Create build directory
      run: mkdir build

    - name: Configure CMake
      working-directory: build
      run: |
        $qtPath = if ($env:Qt6_DIR) { $env:Qt6_DIR } else { $env:QT_ROOT_DIR }
        echo "Using Qt path: $qtPath"
        cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_PREFIX_PATH="$qtPath"

    - name: Build project
      working-directory: build
      run: |
        cmake --build . --config ${{ env.BUILD_TYPE }} --parallel 4

    - name: Verify executable exists
      run: |
        if (Test-Path "build/backtestApp/${{ env.BUILD_TYPE }}/backtestapp.exe") {
          echo "✅ Executable found"
          Get-ChildItem "build/backtestApp/${{ env.BUILD_TYPE }}/"
        } else {
          echo "❌ Executable not found"
          Get-ChildItem "build/backtestApp/" -Recurse
          exit 1
        }

    - name: Create distribution folder
      run: |
        $distDir = "fast-backtest-app-windows"
        $sourceDir = "build/backtestApp/${{ env.BUILD_TYPE }}"
        
        # Create the distribution directory if it doesn't exist
        New-Item -ItemType Directory -Path $distDir -Force
        
        # Copy the executable and all DLLs
        Copy-Item "$sourceDir/*" $distDir -Recurse -Force

        # Copy the default configuration file if it exists
        if (Test-Path "backtestApp/backtest_config.ini") {
          Copy-Item "backtestApp/backtest_config.ini" "$distDir/backtest_config.ini" -Force
          echo "✅ Default configuration file copied"
        }

        # Copy the data folders if they exist
        if (Test-Path "data") {
          Copy-Item "data" "$distDir/data" -Recurse -Force
        }

        # Copy the README/LICENSE files if they exist
        @("README.md", "LICENSE", "CHANGELOG.md") | ForEach-Object {
          if (Test-Path $_) {
            Copy-Item $_ $distDir -Force
          }
        }
        
        # Display the contents of the distribution folder
        echo "Distribution folder contents:"
        Get-ChildItem $distDir -Recurse

    - name: Create ZIP archive
      run: |
        $archiveName = "fast-backtest-app-windows-v${{ env.VERSION }}.zip"
        Compress-Archive -Path "fast-backtest-app-windows/*" -DestinationPath $archiveName
        echo "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV

    - name: Calculate checksum and size
      run: |
        # Calculate the checksum of the ZIP file
        $checksum = Get-FileHash $env:ARCHIVE_NAME -Algorithm SHA256
        echo "CHECKSUM=$($checksum.Hash)" >> $env:GITHUB_ENV
        echo "checksum=$($checksum.Hash)" >> $env:GITHUB_OUTPUT

        # Calculate the size of the file
        $size = (Get-Item $env:ARCHIVE_NAME).Length
        echo "DOWNLOAD_SIZE=$size" >> $env:GITHUB_ENV
        echo "download_size=$size" >> $env:GITHUB_OUTPUT

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fast-backtest-app-windows
        path: fast-backtest-app-windows/
        retention-days: 30

    - name: Get commit info
      id: commit
      run: |
        $shortSha = "${{ github.sha }}".Substring(0, 7)
        $commitMsg = git log -1 --pretty=format:"%s"
        echo "SHORT_SHA=$shortSha" >> $env:GITHUB_ENV
        echo "COMMIT_MSG=$commitMsg" >> $env:GITHUB_ENV

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: fast-backtest-app v${{ env.VERSION }}
        body: |
          **New release v${{ env.VERSION }}**

          **Build Information:**
          - Version: ${{ env.VERSION }}
          - Checksum SHA256: `${{ env.CHECKSUM }}`
          - Size: ${{ env.DOWNLOAD_SIZE }} bytes
          - Commit: ${{ env.SHORT_SHA }}
          - Qt Version: ${{ env.QT_VERSION }}
          - Build Type: ${{ env.BUILD_TYPE }}
          - Date: ${{ github.event.head_commit.timestamp }}

          **Contents:**
          - Windows 64-bit executable (`backtestapp.exe`)
          - All necessary Qt DLLs
          - ChartDirector DLL
          - Data files (if present)

          **Installation:**
          1. Download the ZIP file
          2. Extract it to a folder of your choice
          3. Run `backtestapp.exe`

        draft: false
        prerelease: false
        files: ${{ env.ARCHIVE_NAME }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout releases repository
      if: github.ref == 'refs/heads/main'
      uses: actions/checkout@v4
      with:
        repository: FinTechCpp/fast-backtest-app-releases
        path: releases-repo
        token: ${{ secrets.RELEASE_REPO_PAT }}  # You need to create this secret in your repository

    - name: Upload executable ZIP to GitHub Pages
      if: github.ref == 'refs/heads/main'
      env:
        VERSION: ${{ steps.version.outputs.version }}
        ARCHIVE_NAME: ${{ env.ARCHIVE_NAME }}
      run: |
        # Create downloads directory if it doesn't exist
        New-Item -ItemType Directory -Path "releases-repo/downloads" -Force
        
        # Copy the executable ZIP to the downloads directory
        Copy-Item $env:ARCHIVE_NAME "releases-repo/downloads/$env:ARCHIVE_NAME" -Force
        
        # Also create a "latest" version for easy access
        Copy-Item $env:ARCHIVE_NAME "releases-repo/downloads/fast-backtest-app-windows-latest.zip" -Force
        
        echo "Uploaded executable ZIP to GitHub Pages"
        echo "File size: $((Get-Item $env:ARCHIVE_NAME).Length) bytes"

    - name: Update download URL in website
      if: github.ref == 'refs/heads/main'
      env:
        VERSION: ${{ steps.version.outputs.version }}
        ARCHIVE_NAME: ${{ env.ARCHIVE_NAME }}
      run: |
        $htmlFile = "releases-repo/index.html"
        $content = Get-Content $htmlFile -Raw
        $version = $env:VERSION
        $archiveName = $env:ARCHIVE_NAME

        # Update the stable version number and download link to GitHub Pages
        $newVersion = "v$version"
        $downloadUrl = "https://fintechcpp.github.io/fast-backtest-app-releases/downloads/$archiveName"
        
        # Update version tag
        $content = $content -replace '(<span class="version-tag">v)[\d\.]+(<\/span>)', "`${1}$version`$2"
        
        # Update download link to point to GitHub Pages
        $content = $content -replace '(<a href=")[^"]+(" class="button">Télécharger pour Windows<\/a>)', "`${1}$downloadUrl`$2"
        
        $content | Set-Content $htmlFile -Force
        echo "Updated download URL to: $downloadUrl"

    - name: Commit and push changes to releases repository
      if: github.ref == 'refs/heads/main'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        cd releases-repo
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add .
        git commit -m "Update download URL and upload executable for version v$env:VERSION"
        git push

    - name: Send Discord Release Notification
      if: github.ref == 'refs/heads/main'
      env:
        DISCORD_WEBHOOK_RELEASES_URL: ${{ secrets.DISCORD_WEBHOOK_RELEASES_URL }}
        VERSION: ${{ steps.version.outputs.version }}
        ARCHIVE_NAME: ${{ env.ARCHIVE_NAME }}
        SHORT_SHA: ${{ github.sha }}
      run: |
        $releaseUrl = "https://github.com/${{ github.repository }}/releases/tag/v$env:VERSION"
        $downloadUrl = "https://fintechcpp.github.io/fast-backtest-app-releases/downloads/$env:ARCHIVE_NAME"
        $commitUrl = "https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
        $shortSha = $env:SHORT_SHA.Substring(0, 7)
        $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC"
        
        # Create Discord embed message for release
        $embedData = @{
          embeds = @(
            @{
              title = "🚀 Nouvelle Release - fast-backtest-app v$env:VERSION"
              description = "Une nouvelle version de l'application est disponible !"
              color = 65280  # Green color
              fields = @(
                @{
                  name = "📦 Version"
                  value = "v$env:VERSION"
                  inline = $true
                },
                @{
                  name = "💾 Taille"
                  value = "$([math]::Round($env:DOWNLOAD_SIZE / 1MB, 2)) MB"
                  inline = $true
                },
                @{
                  name = "🛠️ Qt Version"
                  value = "${{ env.QT_VERSION }}"
                  inline = $true
                },
                @{
                  name = "🔧 Build Type"
                  value = "${{ env.BUILD_TYPE }}"
                  inline = $true
                },
                @{
                  name = "📅 Date"
                  value = $timestamp
                  inline = $true
                },
                @{
                  name = "🔗 Commit"
                  value = "[$shortSha]($commitUrl)"
                  inline = $true
                },
                @{
                  name = "📥 Téléchargement"
                  value = "[Télécharger v$env:VERSION]($downloadUrl)"
                  inline = $false
                },
                @{
                  name = "📋 Page de Release"
                  value = "[Voir sur GitHub]($releaseUrl)"
                  inline = $false
                }
              )
              timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
              footer = @{
                text = "fast-backtest-app • GitHub Actions"
              }
            }
          )
        } | ConvertTo-Json -Depth 10
        
        # Send notification to Discord
        try {
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_RELEASES_URL -Method Post -Body $embedData -ContentType "application/json"
          echo "✅ Discord notification sent successfully"
        } catch {
          echo "❌ Failed to send Discord notification: $($_.Exception.Message)"
          echo "Webhook URL exists: $($null -ne $env:DISCORD_WEBHOOK_RELEASES_URL)"
        }

    - name: Build Summary
      env:
        VERSION: ${{ steps.version.outputs.version }}
        SHORT_SHA: ${{ github.sha }}
        ARCHIVE_NAME: ${{ env.ARCHIVE_NAME }}
      run: |
        echo "## ✅ Build Successful" >> $env:GITHUB_STEP_SUMMARY
        echo "" >> $env:GITHUB_STEP_SUMMARY
        if ("${{ github.ref }}" -eq "refs/heads/main") {
          echo "**Executable uploaded to GitHub Pages:** [Download v$env:VERSION](https://fintechcpp.github.io/fast-backtest-app-releases/downloads/$env:ARCHIVE_NAME)" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "**Official Release:** [GitHub Release v$env:VERSION](https://github.com/${{ github.repository }}/releases/tag/v$env:VERSION)" >> $env:GITHUB_STEP_SUMMARY
        } else {
          echo "**Development Build** (no release created)" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "**Artifact:** Available in GitHub Actions artifacts for download" >> $env:GITHUB_STEP_SUMMARY
        }
        echo "" >> $env:GITHUB_STEP_SUMMARY
        echo "**Build Details:**" >> $env:GITHUB_STEP_SUMMARY
        echo "- Version: $env:VERSION" >> $env:GITHUB_STEP_SUMMARY
        echo "- Branch: ${{ github.ref_name }}" >> $env:GITHUB_STEP_SUMMARY
        echo "- Commit: $($env:SHORT_SHA.Substring(0, 7))" >> $env:GITHUB_STEP_SUMMARY
        echo "- Qt Version: ${{ env.QT_VERSION }}" >> $env:GITHUB_STEP_SUMMARY
        echo "- Build Type: ${{ env.BUILD_TYPE }}" >> $env:GITHUB_STEP_SUMMARY
        echo "- Archive: $env:ARCHIVE_NAME" >> $env:GITHUB_STEP_SUMMARY
        if ("${{ github.ref }}" -eq "refs/heads/main") {
          echo "- Public Download: https://fintechcpp.github.io/fast-backtest-app-releases/#download" >> $env:GITHUB_STEP_SUMMARY
        }