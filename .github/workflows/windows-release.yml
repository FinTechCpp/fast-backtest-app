# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json

name: Windows Release Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Release
  QT_VERSION: 6.8.3

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      actions: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0  # Nécessaire pour l'historique complet

    - name: Calculate version
      id: version
      run: |
        # Obtenir le dernier tag existant
        $lastTag = git describe --tags --abbrev=0 2>$null
        
        if (-not $lastTag) {
          # Si aucun tag n'existe, utiliser la version de base du fichier VERSION
          $baseVersion = Get-Content "VERSION" -Raw
          $baseVersion = $baseVersion.Trim()
          $version = "$baseVersion.1"  # Commencer avec .1
        } else {
          # Extraire la version du dernier tag (sans le 'v' au début)
          $lastVersion = $lastTag -replace '^v', ''
          
          # Diviser la version en parties
          $versionParts = $lastVersion.Split('.')
          
          # Incrémenter le dernier numéro
          $lastPart = [int]$versionParts[-1] + 1
          $versionParts[-1] = $lastPart
          
          # Reconstruire la version complète
          $version = $versionParts -join '.'
        }
        
        echo "VERSION=$version" >> $env:GITHUB_ENV
        echo "version=$version" >> $env:GITHUB_OUTPUT
        
        echo "Dernier tag: $lastTag"
        echo "Nouvelle version: $version"

    - name: Set up MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        modules: qtcharts 
        cache: true

    - name: Verify Qt installation
      run: |
        echo "Qt version: ${{ env.QT_VERSION }}"
        echo "Qt6_DIR: $env:Qt6_DIR"
        echo "QT_ROOT_DIR: $env:QT_ROOT_DIR"
        qmake --version
        where qmake

    - name: Create build directory
      run: mkdir build

    - name: Configure CMake
      working-directory: build
      run: |
        $qtPath = if ($env:Qt6_DIR) { $env:Qt6_DIR } else { $env:QT_ROOT_DIR }
        echo "Using Qt path: $qtPath"
        cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_PREFIX_PATH="$qtPath"

    - name: Build project
      working-directory: build
      run: |
        cmake --build . --config ${{ env.BUILD_TYPE }} --parallel 4

    - name: Verify executable exists
      run: |
        if (Test-Path "build/backtestApp/${{ env.BUILD_TYPE }}/backtestapp.exe") {
          echo "✅ Executable found"
          Get-ChildItem "build/backtestApp/${{ env.BUILD_TYPE }}/"
        } else {
          echo "❌ Executable not found"
          Get-ChildItem "build/backtestApp/" -Recurse
          exit 1
        }

    - name: Create distribution folder
      run: |
        $distDir = "ig-trading-bot-windows"
        $sourceDir = "build/backtestApp/${{ env.BUILD_TYPE }}"
        
        # Créer le dossier de distribution
        New-Item -ItemType Directory -Path $distDir -Force
        
        # Copier l'exécutable et toutes les DLL
        Copy-Item "$sourceDir/*" $distDir -Recurse -Force
        
        # Copier les dossiers de données si ils existent
        if (Test-Path "data") {
          Copy-Item "data" "$distDir/data" -Recurse -Force
        }
        
        # Copier les fichiers README/LICENSE si ils existent
        @("README.md", "LICENSE", "CHANGELOG.md") | ForEach-Object {
          if (Test-Path $_) {
            Copy-Item $_ $distDir -Force
          }
        }
        
        # Afficher le contenu du dossier de distribution
        echo "Distribution folder contents:"
        Get-ChildItem $distDir -Recurse

    - name: Create ZIP archive
      run: |
        $archiveName = "ig-trading-bot-windows-v${{ env.VERSION }}.zip"
        Compress-Archive -Path "ig-trading-bot-windows/*" -DestinationPath $archiveName
        echo "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV

    - name: Calculate checksum and size
      run: |
        # Calculer le checksum du fichier ZIP
        $checksum = Get-FileHash $env:ARCHIVE_NAME -Algorithm SHA256
        echo "CHECKSUM=$($checksum.Hash)" >> $env:GITHUB_ENV
        echo "checksum=$($checksum.Hash)" >> $env:GITHUB_OUTPUT
        
        # Calculer la taille du fichier
        $size = (Get-Item $env:ARCHIVE_NAME).Length
        echo "DOWNLOAD_SIZE=$size" >> $env:GITHUB_ENV
        echo "download_size=$size" >> $env:GITHUB_OUTPUT

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ig-trading-bot-windows
        path: ig-trading-bot-windows/
        retention-days: 30

    - name: Get commit info
      id: commit
      run: |
        $shortSha = "${{ github.sha }}".Substring(0, 7)
        $commitMsg = git log -1 --pretty=format:"%s"
        echo "SHORT_SHA=$shortSha" >> $env:GITHUB_ENV
        echo "COMMIT_MSG=$commitMsg" >> $env:GITHUB_ENV

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: IG-Trading-Bot v${{ env.VERSION }}
        body: |
          🚀 **Nouvelle release v${{ env.VERSION }}**
          
          **Informations de build:**
          - Version: ${{ env.VERSION }}
          - Checksum SHA256: `${{ env.CHECKSUM }}`
          - Taille: ${{ env.DOWNLOAD_SIZE }} octets
          - Commit: ${{ env.SHORT_SHA }}
          - Qt Version: ${{ env.QT_VERSION }}
          - Build Type: ${{ env.BUILD_TYPE }}
          - Date: ${{ github.event.head_commit.timestamp }}
          
          **Contenu:**
          - Exécutable Windows 64-bit (`backtestapp.exe`)
          - Toutes les DLL Qt nécessaires
          - ChartDirector DLL
          - Fichiers de données (si présents)
          
          **Installation:**
          1. Téléchargez le fichier ZIP
          2. Extrayez-le dans un dossier de votre choix
          3. Lancez `backtestapp.exe`
  
        draft: false
        prerelease: false
        files: ${{ env.ARCHIVE_NAME }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Summary
      run: |
        echo "## ✅ Build Successful" >> $env:GITHUB_STEP_SUMMARY
        echo "" >> $env:GITHUB_STEP_SUMMARY
        echo "**Release Created:** [v${{ env.VERSION }}](https://github.com/hugoMiCode/ig-trading-bot/releases/tag/v${{ env.VERSION }})" >> $env:GITHUB_STEP_SUMMARY
        echo "" >> $env:GITHUB_STEP_SUMMARY
        echo "**Build Details:**" >> $env:GITHUB_STEP_SUMMARY
        echo "- Version: ${{ env.VERSION }}" >> $env:GITHUB_STEP_SUMMARY
        echo "- Commit: ${{ env.SHORT_SHA }}" >> $env:GITHUB_STEP_SUMMARY
        echo "- Qt Version: ${{ env.QT_VERSION }}" >> $env:GITHUB_STEP_SUMMARY
        echo "- Build Type: ${{ env.BUILD_TYPE }}" >> $env:GITHUB_STEP_SUMMARY
        echo "- Archive: ${{ env.ARCHIVE_NAME }}" >> $env:GITHUB_STEP_SUMMARY