stages:
  - build
  - release

variables:
  # Configuration MXE
  MXE_TARGET: "x86_64-w64-mingw32.static"
  CMAKE_TOOLCHAIN_FILE: "/opt/mxe/usr/x86_64-w64-mingw32.static/share/cmake/mxe-conf.cmake"

# Build Docker image avec MXE (optionnel, si vous voulez utiliser une image custom)
build-mxe-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t mxe-qt6-builder .
    - docker tag mxe-qt6-builder $CI_REGISTRY_IMAGE/mxe-qt6-builder:latest
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/mxe-qt6-builder:latest
  only:
    - develop
  when: manual

build-windows:
  stage: build
  image: ubuntu:22.04
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update
    - apt-get install -y autoconf automake autopoint bash bison bzip2 flex g++ g++-multilib gettext git gperf intltool libc6-dev-i386 libgdk-pixbuf2.0-dev libltdl-dev libgl-dev libpcre3-dev libssl-dev libtool-bin libxml-parser-perl lzip make openssl p7zip-full patch perl python3 python3-mako python3-pkg-resources ruby sed unzip wget xz-utils
    
    # Create python symlink for MXE compatibility
    - ln -sf /usr/bin/python3 /usr/bin/python
    
    - cd /opt
    - git clone https://github.com/mxe/mxe.git
    - cd mxe
    
    # Get the correct checksum for Qt 6.8.3
    - echo "Downloading Qt 6.8.3 to get correct checksum..."
    - wget -O qtbase-6.8.3.tar.xz https://download.qt.io/archive/qt/6.8/6.8.3/submodules/qtbase-everywhere-src-6.8.3.tar.xz
    - echo "Actual Qt 6.8.3 checksum:"
    - sha256sum qtbase-6.8.3.tar.xz
    
    # Apply patch with correct checksum
    - echo "Application des patches pour Qt 6.8.3..."
    - |
      cat > src/qt/qt6/qt6-qtbase.mk << 'EOF'
      # This file is part of MXE. See LICENSE.md for licensing information.

      PKG_BASENAME    := qtbase
      PKG             := qt6-$(PKG_BASENAME)
      $(PKG)_WEBSITE  := https://www.qt.io/
      $(PKG)_DESCR    := Qt6
      $(PKG)_IGNORE   :=
      $(PKG)_VERSION  := 6.8.3
      $(PKG)_CHECKSUM := $(shell sha256sum /opt/mxe/qtbase-6.8.3.tar.xz | cut -d' ' -f1)
      $(PKG)_SUBDIR   := $(PKG_BASENAME)-everywhere-src-$($(PKG)_VERSION)
      $(PKG)_FILE     := $(PKG_BASENAME)-everywhere-src-$($(PKG)_VERSION).tar.xz
      $(PKG)_URL      := https://download.qt.io/archive/qt/6.8/$($(PKG)_VERSION)/submodules/$($(PKG)_FILE)
      $(PKG)_TARGETS  := $(BUILD) $(MXE_TARGETS)
      $(PKG)_DEPS     := cc freetype harfbuzz jpeg libpng mesa mariadb-connector-c openssl pcre2 sqlite zlib zstd $(BUILD)~$(PKG) \
                         $(if $(findstring shared,$(MXE_TARGETS)), icu4c)
      $(PKG)_DEPS_$(BUILD) :=
      $(PKG)_OO_DEPS_$(BUILD) := ninja

      define $(PKG)_UPDATE
          $(WGET) -q -O- https://download.qt.io/official_releases/qt/6.8/ | \
          $(SED) -n 's,.*href="\(6\.[0-9]\.[^/]*\)/".*,\1,p' | \
          grep -iv -- '-rc' | \
          $(SORT) -V | \
          tail -1
      endef

      define $(PKG)_BUILD
          rm -rf '$(PREFIX)/$(TARGET)/$(MXE_QT6_ID)'
          # review $(SOURCE_DIR)/cmake/configure-cmake-mapping.md
          PKG_CONFIG="${TARGET}-pkg-config" \
          PKG_CONFIG_SYSROOT_DIR="/" \
          PKG_CONFIG_LIBDIR="$(PREFIX)/$(TARGET)/lib/pkgconfig" \
          '$(TARGET)-cmake' -S '$(SOURCE_DIR)' -B '$(BUILD_DIR)' \
              -G Ninja \
              -DCMAKE_INSTALL_PREFIX='$(PREFIX)/$(TARGET)/$(MXE_QT6_ID)' \
              -DQT_HOST_PATH='$(PREFIX)/$(BUILD)/$(MXE_QT6_ID)' \
              -DQT_QMAKE_DEVICE_OPTIONS='CROSS_COMPILE=$(TARGET)-;PKG_CONFIG=$(TARGET)-pkg-config' \
              -DPKG_CONFIG_EXECUTABLE='$(PREFIX)/bin/$(TARGET)-pkg-config' \
              -DQT_QMAKE_TARGET_MKSPEC=win32-g++ \
              -DQT_BUILD_EXAMPLES=OFF \
              -DQT_BUILD_TESTS=OFF \
              -DBUILD_WITH_PCH=OFF \
              -DFEATURE_accessibility=ON \
              -DFEATURE_dbus=OFF \
              -DFEATURE_fontconfig=OFF \
              -DFEATURE_system_freetype=ON \
              -DFEATURE_glib=OFF \
              -DFEATURE_system_harfbuzz=ON \
              -DFEATURE_icu=$(CMAKE_SHARED_BOOL) \
              -DFEATURE_opengl_dynamic=ON \
              -DFEATURE_openssl=ON \
              -DFEATURE_openssl_linked=ON \
              -DOPENSSL_USE_STATIC_LIBS=TRUE \
              -DFEATURE_system_pcre2=ON \
              -DFEATURE_pkg_config=ON \
              -DFEATURE_sql_mysql=ON \
              -DMySQL_INCLUDE_DIR='$(PREFIX)/$(TARGET)/include/mariadb' \
              -DMySQL_LIBRARY_DIR='$(PREFIX)/$(TARGET)/lib/mariadb' \
              -DMySQL_LIBRARY=$(if $(BUILD_STATIC),"`$(TARGET)-pkg-config --libs libmariadb`",'$(PREFIX)/$(TARGET)/lib/mariadb/libmariadb.a') \
              -DFEATURE_sql_odbc=ON \
              -DFEATURE_sql_psql=OFF \
              -DFEATURE_system_sqlite=ON \
              -DFEATURE_system_zlib=ON \
              -DFEATURE_use_gold_linker_alias=OFF \
              $(PKG_CMAKE_OPTS)

          cmake --build '$(BUILD_DIR)' -j '$(JOBS)'
          cmake --install '$(BUILD_DIR)'
          $(if $(BUILD_STATIC),$(SED) -i -e 's/^QMAKE_PRL_LIBS .*/& -lodbc32/;' \
                -e 's/^QMAKE_PRL_LIBS_FOR_CMAKE .*/&;-lodbc32/;' \
                    '$(PREFIX)/$(TARGET)/$(MXE_QT6_ID)/plugins/sqldrivers/qsqlodbc.prl',)

          mkdir -p '$(CMAKE_TOOLCHAIN_DIR)'
          echo 'set(QT_HOST_PATH "$(PREFIX)/$(BUILD)/$(MXE_QT6_ID)")' \
              > '$(CMAKE_TOOLCHAIN_DIR)/$(PKG).cmake'
      endef

      define $(PKG)_BUILD_$(BUILD)
          rm -rf '$(PREFIX)/$(TARGET)/$(MXE_QT6_ID)'
          '$(TARGET)-cmake' -S '$(SOURCE_DIR)' -B '$(BUILD_DIR)' \
              -G Ninja \
              -DCMAKE_VERBOSE_MAKEFILE=ON \
              -DCMAKE_CC_COMPILER='$(BUILD_CC)' \
              -DCMAKE_CXX_COMPILER='$(BUILD_CXX)' \
              -DCMAKE_INSTALL_PREFIX='$(PREFIX)/$(TARGET)/$(MXE_QT6_ID)' \
              -DQT_BUILD_{TESTS,EXAMPLES}=OFF \
              -DBUILD_WITH_PCH=OFF \
              -DFEATURE_{eventfd,glib,harfbuzz,icu,opengl,openssl,zstd}=OFF \
              -DFEATURE_sql_{db2,ibase,mysql,oci,odbc,psql,sqlite}=OFF \
              $(PKG_CMAKE_OPTS)
          '$(TARGET)-cmake' --build '$(BUILD_DIR)' -j '$(JOBS)'
          '$(TARGET)-cmake' --install '$(BUILD_DIR)'
      endef
      EOF
    
    # Replace the checksum with the actual one
    - ACTUAL_CHECKSUM=$(sha256sum qtbase-6.8.3.tar.xz | cut -d' ' -f1)
    - sed -i "s/\$(shell sha256sum.*/$ACTUAL_CHECKSUM/" src/qt/qt6/qt6-qtbase.mk
    
    # Verify the patched file
    - echo "Version Qt configurée :"
    - grep "_VERSION.*:= 6.8.3" src/qt/qt6/qt6-qtbase.mk
    - echo "Checksum Qt configuré :"
    - grep "_CHECKSUM.*:=" src/qt/qt6/qt6-qtbase.mk
    
    # Compiler avec Qt 6.8.3
    - make MXE_TARGETS='x86_64-w64-mingw32.static' qt6-qtbase -j$(nproc)
    - make MXE_TARGETS='x86_64-w64-mingw32.static' qt6-qtcharts -j$(nproc)
    - make MXE_TARGETS='x86_64-w64-mingw32.static' cmake pkgconf -j$(nproc)
    
    - export PATH="/opt/mxe/usr/bin:${PATH}"
    
    # Vérifier que les outils sont disponibles
    - echo "Outils MXE disponibles :"
    - ls /opt/mxe/usr/bin/x86_64-w64-mingw32.static-* | head -5
  script:
    - cd $CI_PROJECT_DIR
    - mkdir -p build-windows
    - cd build-windows
    
    # Vérifier que l'outil cmake existe
    - which x86_64-w64-mingw32.static-cmake
    
    # Configuration CMake avec MXE
    - x86_64-w64-mingw32.static-cmake .. \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX=/install \
        -DBUILD_WITH_DEBUG=OFF
    
    - make -j$(nproc)
    - make install DESTDIR=$CI_PROJECT_DIR/windows-release
    
    - cd $CI_PROJECT_DIR
    - mkdir -p artifacts/windows
    - cp -r windows-release/install/* artifacts/windows/
    
    - cd artifacts
    - tar -czf ig-trading-bot-windows-x64.tar.gz windows/
  artifacts:
    paths:
      - artifacts/ig-trading-bot-windows-x64.tar.gz
    expire_in: 1 week
    name: "ig-trading-bot-windows-${CI_COMMIT_SHORT_SHA}"
  only:
    - develop 
  cache:
    key: "mxe-qt6-${CI_RUNNER_ID}"
    paths:
      - /opt/mxe/pkg/
      - /opt/mxe/log/
      - /opt/mxe/usr/x86_64-w64-mingw32.static/
    policy: pull-push
  timeout: 4h  # MXE peut prendre du temps

# Créer une release GitLab
create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Création de la release pour le commit $CI_COMMIT_SHA"
  release:
    name: 'Release $CI_COMMIT_SHORT_SHA'
    description: 'Version automatique générée depuis le commit $CI_COMMIT_SHA'
    tag_name: 'v1.0.$CI_PIPELINE_IID'
    assets:
      links:
        - name: 'ig-trading-bot-windows-x64.tar.gz'
          url: '$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/artifacts/ig-trading-bot-windows-x64.tar.gz'
  dependencies:
    - build-windows
  only:
    - develop