[server]
maxMessageSize = 500
enableXsrfProtection = false
enableCORS = false

[browser]
gatherUsageStats = false

[logger]
level = "info"

[global]
developmentMode = false

[theme]

base = "light"

# Primary accent color.
primaryColor = "#1f77b4"

# Background color of the app.
backgroundColor = "#f5f5f5"

# Background color used for most interactive widgets.
secondaryBackgroundColor = "#ffffff"

# Color used for almost all text.
textColor = "#333333"

# Color used for all links.
linkColor = "#0066cc"

# Background color used for code blocks.
codeBackgroundColor = "#f0f0f0"

# The font family for all text, except code blocks.
font = "sans-serif"

# The font family to use for code (monospace) in the sidebar.
codeFont = "monospace"

# The font family to use for headings.
headingFont = "sans-serif"

# No custom fonts in this example.
fontFaces = []

# The radius used as basis for the corners of most UI elements.
baseRadius = "0.5rem"

# The color of the border around elements.
borderColor = "#dddddd"

# Whether to show a border around input widgets.
showWidgetBorder = true

# Sets the root font size (in pixels) for the app.
baseFontSize = 16

# Whether to show a vertical separator between the sidebar and the main content area.
showSidebarBorder = true


[theme.sidebar]

# Primary accent color.
primaryColor = "#1f77b4"

# Background color of the sidebar.
backgroundColor = "#fafafa"

# Background color used for most interactive widgets in sidebar.
secondaryBackgroundColor = "#ffffff"

# Color used for almost all text in sidebar.
textColor = "#333333"

# Color used for all links in sidebar.
linkColor = "#0066cc"

# Background color used for code blocks.
codeBackgroundColor = "#f0f0f0"

# The font family for all text in the sidebar.
font = "sans-serif"

# The font family to use for code (monospace) in the sidebar.
codeFont = "monospace"

# The font family to use for headings in the sidebar.
headingFont = "sans-serif"

# The radius used as basis for the corners of most UI elements.
baseRadius = "0.5rem"

# The color of the border around elements.
borderColor = "#dddddd"

# Whether to show a border around input widgets.
showWidgetBorder = true
