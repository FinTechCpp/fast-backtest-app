<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IG Trading - Lightweight Charts</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1e222d;
            color: #d1d4dc;
        }
        header {
            background-color: #363c4a;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #4c525e;
        }
        main {
            padding: 20px;
        }
        #chart-container {
            height: 500px;
            width: 100%;
            margin-bottom: 20px;
        }
        .status {
            margin-top: 10px;
            padding: 5px 10px;
            background-color: #2a2e39;
            border-radius: 4px;
        }
        .status.connected {
            color: #4CAF50;
        }
        .status.disconnected {
            color: #F44336;
        }
        select, button {
            background-color: #2a2e39;
            color: #d1d4dc;
            border: 1px solid #4c525e;
            padding: 5px 10px;
            border-radius: 4px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>IG Trading Data Visualization</h1>
        <div id="connection-status" class="status disconnected">Disconnected</div>
    </header>
    
    <main>
        <div class="controls">
            <select id="interval-select">
                <option value="10">10 seconds</option>
                <option value="20">20 seconds</option>
                <option value="30">30 seconds</option>
                <option value="60">1 minute</option>
                <option value="300">5 minutes</option>
                <option value="900">15 minutes</option>
            </select>
            <button id="refresh-btn">Refresh Data</button>
        </div>
        
        <div id="chart-container"></div>
    </main>
    
    <!-- Chargement de la bibliothèque Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    
    <!-- Notre script pour gérer le graphique -->
    <script src="/static/chart.js"></script>
</body>
</html>
