[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "igtrader"
version = "0.1.0"
authors = [
    {name = "Hugo & Maxime"},
]
description = "IG Trading Bot"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
]

[tool.setuptools]
packages = ["igtrader"]